name: Build Steel Cutting Optimizer v2

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt

    - name: Build Single EXE File with Core and UI Packages
      run: |
        pyinstaller --onefile --windowed --name="Steel_Cutting_Optimizer" --add-data "core;core" --add-data "ui;ui" main.py

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Steel-Cutting-Optimizer-v2
        path: dist/Steel_Cutting_Optimizer.exe
